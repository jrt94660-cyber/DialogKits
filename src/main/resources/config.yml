# DialogKits is a standalone kit plugin. It does not require PlayerKits2.
# On first start, it can safely COPY/import compatible PlayerKits2 data without modifying that folder.
migration:
  import-playerkits2-on-first-start: true
  kit-name-aliases:
    StarterKit: Starter
    BoosterKit: booster
    OgKit: og
    Taho+Kit: taho+
    Taho++Kit: taho++
    ComedianKit: media

admin:
  owner-group: "owner"

# Optional first-join kit. Old "StarterKit" will be mapped to "Starter".
first-join-kit: ""

commands:
  short-claim: false

claim:
  drop-items-if-full-inventory: false
  close-menu-after-claim: false

preview:
  enabled: true
  requires-permission: false

bedrock:
  enabled: true
  title: "&8Player Kits"
  preview-title: "&8Preview: %kit%"
  filler: BLACK_STAINED_GLASS_PANE

kits:
  editor-title: "&8Edit Kit: %kit%"
  new-kit-defaults:
    cooldown: 3600

ui:
  title: "&8Player Kits"
  add-kit-button: "&aAdd Kit"
  empty-description: "&7No kits have been assigned yet. Click &aAdd Kit &7to manage the kit list."
  no-kits-for-player: "&7No kits are available yet."
  description: "&7Choose an action for each kit. Ready is green, Claimed is yellow, Locked is red."
  use-kit-display-name: true
  ready-button: "&a%kit% &8| &aReady"
  claimed-button: "&e%kit% &8| &eClaimed"
  locked-button: "&c%kit% &8| &cLocked"
  preview-button: "&bPreview"
  preview-title: "&8Preview &7» &f%kit%"
  preview-back-button: "&7Back to Kits"
  preview-list-limit: 14
