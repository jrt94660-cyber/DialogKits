name: DialogKits
version: 1.0.9
main: com.taho.dialogkits.DialogKitsPlugin
api-version: '1.21.11'
description: Native Java dialogs for PlayerKits2, with Floodgate Bedrock fallback.
author: Taho
softdepend:
  - PlayerKits2
  - floodgate

commands:
  dialogkitsadmin:
    description: Edit native kit dialog positions.
    usage: /dialogkitsadmin edit
  dialogkits:
    description: Open or manage the native PlayerKits2 dialog menu.
    usage: /dialogkits [open|claim <kit>|locked <kit>|preview <kit>|reload]

permissions:
  dialogkits.admin:
    description: Allows editing kit positions in the native DialogKits admin dialog.
    default: op
  dialogkits.open:
    description: Allows opening the DialogKits menu.
    default: true
  dialogkits.reload:
    description: Allows reloading DialogKits configuration.
    default: op
