name: DialogKits
version: 1.2.6
main: com.taho.dialogkits.DialogKitsPlugin
api-version: '1.21.11'
description: Standalone kit management with native Java dialogs and a Bedrock chest GUI.
author: Taho
softdepend:
  - LuckPerms
  - Vault
  - PlaceholderAPI
  - floodgate
  - peyajAuth

commands:
  kit:
    description: Open or manage standalone DialogKits kits.
    usage: /kit [help|open|<kit>|claim <kit>|preview <kit>|create <name>|edit <kit>|replace <kit>|remove <kit>|delete <kit>|give <kit> <player>|verify|reload]
    aliases: [kits, playerkits]
  dialogkits:
    description: Open or manage the standalone DialogKits menu.
    usage: /dialogkits [open|help|claim <kit>|preview <kit>|replace <kit>|reload]
  dialogkitsadmin:
    description: Assign kit positions in the native dialog.
    usage: /dialogkitsadmin edit

permissions:
  dialogkits.open:
    description: Allows opening the DialogKits menu.
    default: true
  dialogkits.reload:
    description: Allows reloading DialogKits configuration.
    default: op
  dialogkits.admin:
    description: Legacy node; kit management remains restricted to the configured LuckPerms owner primary group.
    default: false
  dialogkits.kit.*:
    description: Allows claiming kits that require a kit permission.
    default: false
